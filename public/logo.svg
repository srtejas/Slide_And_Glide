<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Gradients for Letters -->
    <linearGradient id="grad-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="35%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="40%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#C51162"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="40%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00A844"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="40%" stop-color="#AA00FF"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0097A7"/>
    </linearGradient>
    <linearGradient id="slide-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="30%" stop-color="#FFD600"/>
      <stop offset="60%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Drop Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="pop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="10" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .bubble-font {
      font-family: system-ui, -apple-system, "Fredoka", "Arial Rounded MT Bold", "Nunito", "Comic Sans MS", sans-serif;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Background Glow & Stars -->
  <g id="sparkles">
    <!-- Star sparkles -->
    <path d="M 120 130 Q 120 160 145 160 Q 120 160 120 190 Q 120 160 95 160 Q 120 160 120 130 Z" fill="#FFD600" opacity="0.9" />
    <path d="M 680 120 Q 680 145 700 145 Q 680 145 680 170 Q 680 145 660 145 Q 680 145 680 120 Z" fill="#FFD600" opacity="0.9" />
    <path d="M 720 280 Q 720 295 735 295 Q 720 295 720 310 Q 720 295 705 295 Q 720 295 720 280 Z" fill="#00E5FF" opacity="0.85" />
    <path d="M 80 320 Q 80 335 95 335 Q 80 335 80 350 Q 80 335 65 335 Q 80 335 80 320 Z" fill="#FF4081" opacity="0.85" />
    <circle cx="160" cy="90" r="8" fill="#FFD600" opacity="0.8" />
    <circle cx="640" cy="80" r="10" fill="#00E676" opacity="0.8" />
    <circle cx="710" cy="210" r="7" fill="#FF4081" opacity="0.8" />
    <circle cx="90" cy="230" r="9" fill="#00B0FF" opacity="0.8" />
  </g>

  <!-- Playful Slide Swoosh -->
  <g id="slide-curve" filter="url(#shadow)">
    <!-- Back slide track shadow -->
    <path d="M 70 380 C 120 200, 300 120, 480 160 C 650 200, 740 330, 680 430 C 630 510, 480 490, 360 450 C 230 410, 140 430, 90 460" 
          fill="none" stroke="#D97706" stroke-width="48" stroke-linecap="round"/>
    <!-- Main colorful slide track -->
    <path d="M 70 375 C 120 195, 300 115, 480 155 C 650 195, 740 325, 680 425 C 630 505, 480 485, 360 445 C 230 405, 140 425, 90 455" 
          fill="none" stroke="url(#slide-grad)" stroke-width="38" stroke-linecap="round"/>
    <!-- Slide highlights -->
    <path d="M 85 365 C 130 195, 300 125, 475 160 C 640 195, 725 320, 675 415" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Fluffy Cloud Puffs at base -->
  <g id="clouds" opacity="0.95" filter="url(#shadow)">
    <!-- Left Cloud -->
    <path d="M 60 470 A 30 30 0 0 1 110 450 A 45 45 0 0 1 180 450 A 30 30 0 0 1 220 480 A 25 25 0 0 1 200 520 L 70 520 A 25 25 0 0 1 60 470 Z" fill="#FFFFFF"/>
    <!-- Right Cloud -->
    <path d="M 580 470 A 30 30 0 0 1 630 450 A 45 45 0 0 1 700 450 A 30 30 0 0 1 740 480 A 25 25 0 0 1 720 520 L 590 520 A 25 25 0 0 1 580 470 Z" fill="#FFFFFF"/>
  </g>

  <!-- Main Word: SLIDE (Arching Top) -->
  <g id="word-slide" filter="url(#pop-shadow)">
    <!-- S -->
    <g transform="translate(165, 190) rotate(-12)">
      <!-- Outline / 3D Extrusion -->
      <text class="bubble-font" x="0" y="8" font-size="125" fill="#B45309" stroke="#78350F" stroke-width="22" stroke-linejoin="round">S</text>
      <!-- Letter Fill -->
      <text class="bubble-font" x="0" y="0" font-size="125" fill="url(#grad-yellow)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">S</text>
      <!-- Specular Highlight -->
      <ellipse cx="-18" cy="-30" rx="12" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(-30, -18, -30)"/>
    </g>

    <!-- L -->
    <g transform="translate(265, 170) rotate(-6)">
      <text class="bubble-font" x="0" y="8" font-size="125" fill="#0369A1" stroke="#0C4A6E" stroke-width="22" stroke-linejoin="round">L</text>
      <text class="bubble-font" x="0" y="0" font-size="125" fill="url(#grad-blue)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">L</text>
      <ellipse cx="-16" cy="-32" rx="10" ry="5" fill="#FFFFFF" opacity="0.8" transform="rotate(-15, -16, -32)"/>
    </g>

    <!-- I -->
    <g transform="translate(345, 160) rotate(-1)">
      <text class="bubble-font" x="0" y="8" font-size="125" fill="#BE123C" stroke="#881337" stroke-width="22" stroke-linejoin="round">I</text>
      <text class="bubble-font" x="0" y="0" font-size="125" fill="url(#grad-pink)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">I</text>
      <ellipse cx="-6" cy="-32" rx="7" ry="5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- D -->
    <g transform="translate(435, 168) rotate(5)">
      <text class="bubble-font" x="0" y="8" font-size="125" fill="#15803D" stroke="#14532D" stroke-width="22" stroke-linejoin="round">D</text>
      <text class="bubble-font" x="0" y="0" font-size="125" fill="url(#grad-green)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">D</text>
      <ellipse cx="-16" cy="-30" rx="12" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(15, -16, -30)"/>
    </g>

    <!-- E -->
    <g transform="translate(540, 185) rotate(12)">
      <text class="bubble-font" x="0" y="8" font-size="125" fill="#C2410C" stroke="#7C2D12" stroke-width="22" stroke-linejoin="round">E</text>
      <text class="bubble-font" x="0" y="0" font-size="125" fill="url(#grad-orange)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">E</text>
      <ellipse cx="-16" cy="-30" rx="11" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(25, -16, -30)"/>
    </g>
  </g>

  <!-- Ampersand & Symbol (Center Mascot style) -->
  <g id="ampersand" filter="url(#pop-shadow)" transform="translate(400, 260) scale(1.05)">
    <!-- 3D Back -->
    <text class="bubble-font" x="0" y="7" font-size="100" fill="#6B21A8" stroke="#3B0764" stroke-width="20" stroke-linejoin="round">&amp;</text>
    <!-- Top Fill -->
    <text class="bubble-font" x="0" y="0" font-size="100" fill="url(#grad-purple)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">&amp;</text>
    <ellipse cx="-12" cy="-22" rx="8" ry="4" fill="#FFFFFF" opacity="0.85" transform="rotate(-20, -12, -22)"/>
  </g>

  <!-- Main Word: GLIDE (Slight Curve Bottom) -->
  <g id="word-glide" filter="url(#pop-shadow)">
    <!-- G -->
    <g transform="translate(180, 360) rotate(-6)">
      <text class="bubble-font" x="0" y="8" font-size="120" fill="#7E22CE" stroke="#581C87" stroke-width="22" stroke-linejoin="round">G</text>
      <text class="bubble-font" x="0" y="0" font-size="120" fill="url(#grad-purple)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">G</text>
      <ellipse cx="-18" cy="-28" rx="12" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(-15, -18, -28)"/>
    </g>

    <!-- L -->
    <g transform="translate(285, 355) rotate(-2)">
      <text class="bubble-font" x="0" y="8" font-size="120" fill="#B45309" stroke="#78350F" stroke-width="22" stroke-linejoin="round">L</text>
      <text class="bubble-font" x="0" y="0" font-size="120" fill="url(#grad-yellow)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">L</text>
      <ellipse cx="-14" cy="-30" rx="9" ry="5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- I -->
    <g transform="translate(370, 350) rotate(0)">
      <text class="bubble-font" x="0" y="8" font-size="120" fill="#0E7490" stroke="#164E63" stroke-width="22" stroke-linejoin="round">I</text>
      <text class="bubble-font" x="0" y="0" font-size="120" fill="url(#grad-cyan)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">I</text>
      <ellipse cx="-6" cy="-30" rx="7" ry="5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- D -->
    <g transform="translate(460, 355) rotate(3)">
      <text class="bubble-font" x="0" y="8" font-size="120" fill="#BE123C" stroke="#881337" stroke-width="22" stroke-linejoin="round">D</text>
      <text class="bubble-font" x="0" y="0" font-size="120" fill="url(#grad-pink)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">D</text>
      <ellipse cx="-16" cy="-28" rx="11" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(10, -16, -28)"/>
    </g>

    <!-- E -->
    <g transform="translate(565, 365) rotate(7)">
      <text class="bubble-font" x="0" y="8" font-size="120" fill="#15803D" stroke="#14532D" stroke-width="22" stroke-linejoin="round">E</text>
      <text class="bubble-font" x="0" y="0" font-size="120" fill="url(#grad-green)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">E</text>
      <ellipse cx="-16" cy="-28" rx="11" ry="6" fill="#FFFFFF" opacity="0.8" transform="rotate(20, -16, -28)"/>
    </g>
  </g>

  <!-- Tagline Banner at bottom: KIDS INDOOR PLAY ZONE -->
  <g id="tagline-banner" filter="url(#shadow)" transform="translate(400, 500)">
    <!-- Banner Pill Shadow & Outline -->
    <rect x="-290" y="-36" width="580" height="72" rx="36" fill="#312E81" stroke="#1E1B4B" stroke-width="8"/>
    <!-- Banner Fill -->
    <rect x="-286" y="-32" width="572" height="64" rx="32" fill="url(#ribbon-grad)" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Mini playful decorative stars on banner -->
    <path d="M -245 -2 Q -245 8 -237 8 Q -245 8 -245 18 Q -245 8 -253 8 Q -245 8 -245 -2 Z" fill="#FFD600"/>
    <path d="M 245 -2 Q 245 8 253 8 Q 245 8 245 18 Q 245 8 237 8 Q 245 8 245 -2 Z" fill="#FFD600"/>

    <!-- Banner Text -->
    <text class="bubble-font" x="0" y="5" font-size="30" fill="#FFFFFF" letter-spacing="3" font-weight="900">
      KIDS INDOOR PLAY ZONE
    </text>
  </g>
</svg>